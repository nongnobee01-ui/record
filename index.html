<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ---- Supabase project config ----
const SUPABASE_URL = "https://ilmseajjmcnfukbggybv.supabase.co";
const SUPABASE_KEY = "sb_publishable_j5dAF3aJAkjQcmXRU6rYUg_EEeXsaKp";
const REST_URL = `${SUPABASE_URL}/rest/v1/reports`;
const STORAGE_UPLOAD_URL = `${SUPABASE_URL}/storage/v1/object/photos`;
const STORAGE_PUBLIC_URL = `${SUPABASE_URL}/storage/v1/object/public/photos`;

const SUPABASE_HEADERS = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
};

const THAI_MONTHS = [
  "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
  "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม",
];

const MAX_PHOTOS = 6;

function todayParts() {
  const now = new Date();
  return { day: now.getDate(), month: now.getMonth(), year: now.getFullYear() + 543 };
}

function compressImage(file, maxWidth = 900, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("compress failed"))), "image/jpeg", quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function daysInMonth(monthIdx, yearBE) {
  const yearAD = yearBE - 543;
  return new Date(yearAD, monthIdx + 1, 0).getDate();
}

async function uploadPhoto(blob) {
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const res = await fetch(`${STORAGE_UPLOAD_URL}/${path}`, {
    method: "POST",
    headers: { ...SUPABASE_HEADERS, "Content-Type": "image/jpeg" },
    body: blob,
  });
  if (!res.ok) throw new Error("upload failed: " + (await res.text()));
  return `${STORAGE_PUBLIC_URL}/${path}`;
}

// ---- Report detail page (opened in a new tab) ----
function ReportDetailPage({ id }) {
  const [report, setReport] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    let cancelled = false;
    fetch(`${REST_URL}?select=*&id=eq.${id}`, { headers: SUPABASE_HEADERS })
      .then((res) => res.json())
      .then((rows) => {
        if (cancelled) return;
        if (rows && rows[0]) setReport(rows[0]);
        else setError("ไม่พบรายงานนี้");
      })
      .catch(() => { if (!cancelled) setError("โหลดรายงานไม่สำเร็จ"); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [id]);

  return (
    <div style={styles.page}>
      <div style={styles.header}>
        <div style={styles.headerEyebrow}>รายงานหน้างาน</div>
        <div style={styles.headerTitle}>รายละเอียดรายงาน</div>
      </div>

      {loading ? (
        <div style={styles.emptyText}>กำลังโหลด...</div>
      ) : error ? (
        <div style={styles.errorText}>{error}</div>
      ) : (
        <div style={styles.card}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 20, marginBottom: 2 }}>
            {report.rank_name}
          </div>
          <div style={{ fontSize: 13, color: "#5C6672", marginBottom: 16 }}>
            {report.unit} · {report.report_day} {THAI_MONTHS[report.report_month]} {report.report_year}
          </div>

          {report.photo_urls && report.photo_urls.length > 0 && (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
              {report.photo_urls.map((url, idx) => (
                <img
                  key={idx}
                  src={url}
                  alt={`รูปหน้างาน ${idx + 1}`}
                  style={{ width: 130, height: 130, objectFit: "cover", borderRadius: 8, border: "1px solid #C9C2B4" }}
                />
              ))}
            </div>
          )}

          {report.notes && (
            <div>
              <div style={{ fontSize: 13, color: "#5C6672", marginBottom: 4, fontWeight: 500 }}>รายละเอียดงาน</div>
              <div style={{ fontSize: 14, lineHeight: 1.6, color: "#3A4356" }}>{report.notes}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---- Monthly dashboard ----
function Dashboard() {
  const initDate = todayParts();
  const [dMonth, setDMonth] = useState(initDate.month);
  const [dYear, setDYear] = useState(initDate.year);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const yearOptions = Array.from({ length: 6 }, (_, i) => initDate.year - 2 + i);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    fetch(`${REST_URL}?select=*&report_month=eq.${dMonth}&report_year=eq.${dYear}`, { headers: SUPABASE_HEADERS })
      .then((res) => res.json())
      .then((data) => { if (!cancelled) setRows(Array.isArray(data) ? data : []); })
      .catch(() => { if (!cancelled) setRows([]); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [dMonth, dYear]);

  const totalDays = daysInMonth(dMonth, dYear);
  const perDayCounts = Array.from({ length: totalDays }, (_, i) => {
    const d = i + 1;
    return rows.filter((r) => r.report_day === d).length;
  });

  const unitCounts = {};
  rows.forEach((r) => { unitCounts[r.unit] = (unitCounts[r.unit] || 0) + 1; });
  const unitRows = Object.entries(unitCounts).sort((a, b) => b[1] - a[1]);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels: Array.from({ length: totalDays }, (_, i) => i + 1),
        datasets: [{
          data: perDayCounts,
          backgroundColor: "#E8622C",
          borderRadius: 3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
          x: { ticks: { font: { size: 10 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [rows, dMonth, dYear]);

  return (
    <div>
      <div className="srp-date-row" style={{ marginBottom: 16 }}>
        <select className="srp-select srp-dash-select" value={dMonth} onChange={(e) => setDMonth(Number(e.target.value))}>
          {THAI_MONTHS.map((m, idx) => <option key={m} value={idx}>{m}</option>)}
        </select>
        <select className="srp-select" style={{ flex: "0 0 90px" }} value={dYear} onChange={(e) => setDYear(Number(e.target.value))}>
          {yearOptions.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
      </div>

      {loading ? (
        <div style={styles.emptyText}>กำลังโหลด...</div>
      ) : (
        <React.Fragment>
          <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
            <div style={styles.statBox}>
              <div style={styles.statNumber}>{rows.length}</div>
              <div style={styles.statLabel}>รายงานเดือนนี้</div>
            </div>
            <div style={styles.statBox}>
              <div style={styles.statNumber}>{unitRows.length}</div>
              <div style={styles.statLabel}>หน่วยที่ส่ง</div>
            </div>
          </div>

          <div style={styles.card}>
            <div style={styles.sectionTitle}>จำนวนรายงานรายวัน</div>
            <div style={{ height: 180 }}>
              <canvas ref={canvasRef}></canvas>
            </div>
          </div>

          <div style={{ ...styles.card, marginTop: 16 }}>
            <div style={styles.sectionTitle}>สรุปตามหน่วย</div>
            {unitRows.length === 0 ? (
              <div style={styles.emptyText}>ยังไม่มีข้อมูลเดือนนี้</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {unitRows.map(([unit, count]) => (
                  <div key={unit} style={styles.summaryRow}>
                    <span>{unit}</span>
                    <span style={{ fontWeight: 600 }}>{count}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ---- Recent reports calendar popup ----
function RecentReportsModal({ onClose }) {
  const initDate = todayParts();
  const [mMonth, setMMonth] = useState(initDate.month);
  const [mYear, setMYear] = useState(initDate.year);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedDay, setSelectedDay] = useState(null);

  const yearOptions = Array.from({ length: 6 }, (_, i) => initDate.year - 2 + i);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setSelectedDay(null);
    fetch(`${REST_URL}?select=*&report_month=eq.${mMonth}&report_year=eq.${mYear}`, { headers: SUPABASE_HEADERS })
      .then((res) => res.json())
      .then((data) => { if (!cancelled) setRows(Array.isArray(data) ? data : []); })
      .catch(() => { if (!cancelled) setRows([]); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [mMonth, mYear]);

  const totalDays = daysInMonth(mMonth, mYear);
  const yearAD = mYear - 543;
  const firstWeekday = new Date(yearAD, mMonth, 1).getDay();

  const dayCounts = {};
  rows.forEach((r) => { dayCounts[r.report_day] = (dayCounts[r.report_day] || 0) + 1; });

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  const dayReports = selectedDay ? rows.filter((r) => r.report_day === selectedDay) : [];

  return (
    <div className="srp-modal-overlay" onClick={onClose}>
      <div className="srp-modal-card" onClick={(e) => e.stopPropagation()}>
        <div style={styles.sectionTitle}>รายงานประจำวัน</div>

        <div className="srp-date-row" style={{ marginBottom: 12 }}>
          <select className="srp-select srp-dash-select" value={mMonth} onChange={(e) => setMMonth(Number(e.target.value))}>
            {THAI_MONTHS.map((m, idx) => <option key={m} value={idx}>{m}</option>)}
          </select>
          <select className="srp-select" style={{ flex: "0 0 90px" }} value={mYear} onChange={(e) => setMYear(Number(e.target.value))}>
            {yearOptions.map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>

        {loading ? (
          <div style={styles.emptyText}>กำลังโหลด...</div>
        ) : selectedDay ? (
          <div>
            <button type="button" className="srp-cal-back" onClick={() => setSelectedDay(null)}>← กลับไปปฏิทิน</button>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, marginBottom: 10 }}>
              {selectedDay} {THAI_MONTHS[mMonth]} {mYear}
            </div>
            {dayReports.length === 0 ? (
              <div style={styles.emptyText}>ไม่มีรายงานวันนี้</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 340, overflowY: "auto" }}>
                {dayReports.map((r) => (
                  <div key={r.id} style={{ ...styles.reportCard, cursor: "pointer" }} onClick={() => window.open(`?report=${r.id}`, "_blank")}>
                    <div style={{ display: "flex", gap: 10 }}>
                      {r.photo_urls && r.photo_urls[0] && (
                        <img src={r.photo_urls[0]} alt={r.rank_name} style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, flexShrink: 0 }} />
                      )}
                      <div style={{ minWidth: 0, flex: 1 }}>
                        <div style={styles.reportProject}>{r.rank_name}</div>
                        <div style={styles.reportMeta}>{r.unit}</div>
                        {r.notes && <div style={styles.reportNotes}>{r.notes}</div>}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ) : (
          <div>
            <div className="srp-cal-weekdays">
              {["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"].map((d) => <div key={d}>{d}</div>)}
            </div>
            <div className="srp-cal-grid">
              {cells.map((d, idx) =>
                d === null ? (
                  <div key={idx} className="srp-cal-cell empty" />
                ) : (
                  <div
                    key={idx}
                    className={`srp-cal-cell${dayCounts[d] ? " has-reports" : ""}`}
                    onClick={() => setSelectedDay(d)}
                  >
                    <div>{d}</div>
                    {dayCounts[d] ? <div className="srp-cal-badge">{dayCounts[d]}</div> : null}
                  </div>
                )
              )}
            </div>
          </div>
        )}

        <button className="srp-modal-close" onClick={onClose}>ปิด</button>
      </div>
    </div>
  );
}

// ---- Report form ----
function ReportForm() {
  const initDate = todayParts();
  const [rankName, setRankName] = useState("");
  const [unit, setUnit] = useState("");
  const [notes, setNotes] = useState("");
  const [photoFiles, setPhotoFiles] = useState([]);
  const [day, setDay] = useState(initDate.day);
  const [month, setMonth] = useState(initDate.month);
  const [year, setYear] = useState(initDate.year);
  const [showRecentModal, setShowRecentModal] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [toast, setToast] = useState("");
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    const maxDay = daysInMonth(month, year);
    if (day > maxDay) setDay(maxDay);
  }, [month, year, day]);

  async function handleFiles(fileList) {
    setError("");
    const files = Array.from(fileList).slice(0, MAX_PHOTOS - photoFiles.length);
    if (files.length === 0) return;
    try {
      const compressed = await Promise.all(files.map((f) => compressImage(f)));
      const withPreviews = compressed.map((blob) => ({ blob, previewUrl: URL.createObjectURL(blob) }));
      setPhotoFiles((prev) => [...prev, ...withPreviews].slice(0, MAX_PHOTOS));
    } catch (e) {
      setError("แนบรูปไม่สำเร็จ ลองใหม่อีกครั้ง");
    }
  }

  function removePhoto(idx) {
    setPhotoFiles((prev) => {
      const removed = prev[idx];
      if (removed) URL.revokeObjectURL(removed.previewUrl);
      return prev.filter((_, i) => i !== idx);
    });
  }

  async function handleSubmit() {
    setError("");
    if (!rankName.trim()) return setError("กรอกยศ-ชื่อ-สกุล");
    if (!unit.trim()) return setError("กรอกหน่วย");
    if (photoFiles.length === 0) return setError("แนบรูปหน้างานอย่างน้อย 1 รูป");

    setSubmitting(true);
    try {
      const photoUrls = await Promise.all(photoFiles.map((p) => uploadPhoto(p.blob)));
      const res = await fetch(REST_URL, {
        method: "POST",
        headers: { ...SUPABASE_HEADERS, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify({
          rank_name: rankName.trim(),
          unit: unit.trim(),
          notes: notes.trim(),
          report_day: day,
          report_month: month,
          report_year: year,
          photo_urls: photoUrls,
        }),
      });
      if (!res.ok) throw new Error("insert failed: " + (await res.text()));
      photoFiles.forEach((p) => URL.revokeObjectURL(p.previewUrl));
      setNotes("");
      setPhotoFiles([]);
      setToast("บันทึกรายงานแล้ว");
    } catch (e) {
      console.error(e);
      setError("บันทึกไม่สำเร็จ ลองอีกครั้ง");
    } finally {
      setSubmitting(false);
    }
  }

  const dayOptions = Array.from({ length: daysInMonth(month, year) }, (_, i) => i + 1);
  const yearOptions = Array.from({ length: 6 }, (_, i) => initDate.year - 2 + i);

  return (
    <div>
      <div style={styles.card}>
        <div style={styles.label}>ยศ-ชื่อ-สกุล</div>
        <input className="srp-input" placeholder="เช่น ร.ต. สมชาย ใจดี" value={rankName} onChange={(e) => setRankName(e.target.value)} />

        <div style={{ marginTop: 14 }}>
          <div style={styles.label}>หน่วย</div>
          <input className="srp-input" placeholder="เช่น ร.31 พัน.2 รอ." value={unit} onChange={(e) => setUnit(e.target.value)} />
        </div>

        <div style={{ marginTop: 14 }}>
          <div style={styles.label}>วันที่รายงาน</div>
          <div className="srp-date-row">
            <select className="srp-select day" value={day} onChange={(e) => setDay(Number(e.target.value))}>
              {dayOptions.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
            <select className="srp-select month" value={month} onChange={(e) => setMonth(Number(e.target.value))}>
              {THAI_MONTHS.map((m, idx) => <option key={m} value={idx}>{m}</option>)}
            </select>
            <select className="srp-select year" value={year} onChange={(e) => setYear(Number(e.target.value))}>
              {yearOptions.map((y) => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>

        <div style={{ marginTop: 16 }}>
          <div style={styles.label}>รูปหน้างาน</div>
          {photoFiles.length < MAX_PHOTOS && (
            <div className="srp-camera-tile" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
              <span style={{ fontSize: 22 }}>＋</span>
              <span style={{ fontSize: 13 }}>แตะเพื่อถ่าย/แนบรูป ({photoFiles.length}/{MAX_PHOTOS})</span>
            </div>
          )}
          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            multiple
            style={{ display: "none" }}
            onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }}
          />
          {photoFiles.length > 0 && (
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
              {photoFiles.map((p, idx) => (
                <div className="srp-thumb-wrap" key={idx}>
                  <img src={p.previewUrl} alt={`รูปหน้างาน ${idx + 1}`} style={{ width: 60, height: 60, objectFit: "cover", borderRadius: 8, border: "1px solid #C9C2B4" }} />
                  <button className="srp-thumb-remove" onClick={() => removePhoto(idx)} aria-label="ลบรูป">×</button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{ marginTop: 14 }}>
          <div style={styles.label}>รายละเอียดงาน</div>
          <textarea className="srp-textarea" rows={3} placeholder="อธิบายงานที่ทำวันนี้" value={notes} onChange={(e) => setNotes(e.target.value)} />
        </div>

        {error && <div style={styles.errorText}>{error}</div>}

        <button className="srp-submit" style={{ marginTop: 16 }} disabled={submitting} onClick={handleSubmit}>
          {submitting ? "กำลังบันทึก..." : "บันทึกรายงาน"}
        </button>
      </div>

      <button
        type="button"
        onClick={() => setShowRecentModal(true)}
        style={{
          width: "100%",
          marginTop: 14,
          padding: "12px",
          borderRadius: 8,
          border: "1px solid #C9C2B4",
          background: "#FFFFFF",
          color: "#17203A",
          fontFamily: "'Space Grotesk', sans-serif",
          fontWeight: 600,
          fontSize: 14,
          cursor: "pointer",
        }}
      >
        ดูรายงานประจำวัน
      </button>

      {toast && <div style={styles.toast}>{toast}</div>}

      {showRecentModal && <RecentReportsModal onClose={() => setShowRecentModal(false)} />}
    </div>
  );
}

            <li>กดยืนยัน <strong>"ติดตั้ง" / "เพิ่ม"</strong></li>

        <button className="srp-modal-close" onClick={onClose}>ปิด</button>
